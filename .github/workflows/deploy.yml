name: Deploy Frontend

on:
  workflow_dispatch:
  #push:
  #  branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: greencity-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Generate config.js and .env
        run: |
          PUBLIC_IP=${{ secrets.EC2_PUBLIC_IP }}
          cat > config.js << EOF
          window._env_ = {
            backendCoreUrl: "http://${PUBLIC_IP}:8080/",
            backendUserUrl: "http://${PUBLIC_IP}:8060/",
            frontendUrl: "http://${PUBLIC_IP}:4200/",
            socketUrl: "http://${PUBLIC_IP}:8080/socket"
          };
          EOF
          echo "CLIENT_APP_URL=http://${PUBLIC_IP}:4200" > .env
          echo "DATASOURCE_USER=postgres" >> .env
          # Пароль из AWS Secrets Manager
          export DB_SECRET=$(aws secretsmanager get-secret-value --secret-id greencity-rds-env --query SecretString --output text)
          echo "DATASOURCE_PASSWORD=$(echo $DB_SECRET | jq -r .password)" >> .env

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "config.js,.env"
          target: "/home/ubuntu/greencity"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/greencity
            docker-compose pull frontend
            docker-compose up -d frontend
